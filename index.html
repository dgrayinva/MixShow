<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AMP — Live Stream & Fan Wall</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0e0e10; color: #efeff1; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    header { background: #18181b; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2f2f35; gap: 8px; flex-wrap: wrap; }
    .controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    input { background: #0e0e10; border: 1px solid #3a3a3d; color: white; padding: 6px 8px; border-radius: 4px; width: 115px; font-size: 13px; }
    button { background: #9147ff; color: white; border: none; padding: 6px 11px; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 12px; }
    button:hover { opacity: 0.9; }
    button.spotlight { background: #00a8fc; }
    button.toggle { background: #2f2f35; }
    button.emoji-btn { background: #1f1f23; border: 1px solid #3a3a3d; font-size: 15px; padding: 4px 8px; }
    button.leave { background: #eb0400; display: none; }
    .split-container { display: flex; flex: 1; overflow: hidden; position: relative; }
    .main-stage { flex: 1.2; background: #000; border-right: 1px solid #2f2f35; position: relative; }
    .main-stage iframe, .main-stage video { width: 100%; height: 100%; border: none; display: block; object-fit: cover; }
    .grid-pane { flex: 1; padding: 12px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); grid-auto-rows: 130px; gap: 10px; align-content: start; }
    .video-tile { position: relative; background: #1f1f23; border-radius: 8px; overflow: hidden; border: 1px solid #3a3a3d; display: flex; align-items: center; justify-content: center; color: #adadb8; font-size: 12px; height: 130px; }
    .video-tile.dj-tile { border: 2px solid #9147ff; }
    .video-tile video, .video-tile iframe { width: 100%; height: 100%; object-fit: cover; border: none; }
    video { transform: scaleX(-1); }
    .name-tag { position: absolute; bottom: 6px; left: 6px; background: rgba(0,0,0,0.75); color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 11px; z-index: 2; }
    .kick-btn { position: absolute; top: 6px; right: 6px; background: #eb0400; color: #fff; border: none; border-radius: 4px; padding: 2px 6px; font-size: 11px; cursor: pointer; z-index: 3; }
    .chat-pane { width: 280px; background: #18181b; border-left: 1px solid #2f2f35; display: flex; flex-direction: column; }
    .chat-pane.closed { display: none; }
    .chat-header { padding: 10px 12px; font-size: 12px; font-weight: 700; border-bottom: 1px solid #2f2f35; display: flex; justify-content: space-between; align-items: center; color: #adadb8; }
    .chat-messages { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; font-size: 13px; line-height: 1.35; }
    .chat-msg { background: #1f1f23; padding: 6px 9px; border-radius: 6px; word-break: break-word; }
    .chat-msg strong { color: #bf94ff; margin-right: 5px; }
    .chat-msg.dj-msg strong { color: #00e5ff; }
    .chat-form { padding: 8px; border-top: 1px solid #2f2f35; display: flex; gap: 6px; }
    .chat-form input { flex: 1; width: auto; }
    .float-emoji { position: fixed; bottom: 20px; font-size: 32px; pointer-events: none; animation: rise 3s ease-out forwards; z-index: 999; }
    @keyframes rise { 0% { transform: translateY(0) scale(0.8) rotate(0deg); opacity: 1; } 100% { transform: translateY(-78vh) scale(1.4) rotate(25deg); opacity: 0; } }
    body.obs-mode header, body.obs-mode #twitchBox, body.obs-mode #placeholderTile, body.obs-mode #chatPane { display: none !important; }
    body.obs-mode .grid-pane { flex: 1; padding: 0; gap: 4px; background: transparent; }
    body.obs-dj-only .video-tile:not(.dj-tile) { display: none !important; }
    body.obs-dj-only .grid-pane { grid-template-columns: 1fr; grid-auto-rows: 100dvh; }
    body.hide-crowd .video-tile:not(.is-me):not(.dj-tile) { display: none; }
    @media (max-width: 768px) {
      .split-container { flex-direction: column; }
      .main-stage { flex: none; height: 36dvh; border-right: none; border-bottom: 1px solid #2f2f35; }
      .chat-pane { width: 100%; flex: 1; border-left: none; }
      .chat-pane:not(.closed) ~ .grid-pane, .split-container.chat-open .grid-pane { display: none; }
      input { width: 95px; }
    }
  </style>
</head>
<body>
  <header>
    <div><strong>AMP</strong> <span id="spotCount" style="font-size: 11px; color: #adadb8;">• Video Wall (0/20)</span></div>
    <div class="controls">
      <button class="emoji-btn" title="Confetti Burst" onclick="sendEmoji('🎉', true)">🎉</button>
      <button class="emoji-btn" title="Fireworks Burst" onclick="sendEmoji('🎆', true)">🎆</button>
      <button class="emoji-btn" onclick="sendEmoji('🔥', false)">🔥</button>
      <button class="emoji-btn" onclick="sendEmoji('🙌', false)">🙌</button>
      <button class="emoji-btn" onclick="sendEmoji('🪩', false)">🪩</button>
      <button id="chatToggleBtn" class="toggle" onclick="toggleChat()">💬 Chat</button>
      <button id="crowdBtn" class="toggle" onclick="toggleCrowd()">Hide Crowd</button>
      <button id="spotlightBtn" class="spotlight" onclick="spotlightRandom()">Spotlight</button>
      <input type="text" id="username" placeholder="Your Name" />
      <button id="joinBtn" onclick="joinWall()">Join Wall</button>
      <button id="leaveBtn" class="leave" onclick="leaveWall()">Leave</button>
    </div>
  </header>
  <div class="split-container" id="splitContainer">
    <div class="main-stage" id="twitchBox"><div class="name-tag">Main Broadcast</div></div>
    <div class="grid-pane" id="videoGrid">
      <div class="video-tile" id="placeholderTile"><span style="padding:10px;text-align:center;">Click <strong>Join Wall</strong> to share camera &amp; chat (Muted • Max 20)</span></div>
    </div>
    <div class="chat-pane" id="chatPane">
      <div class="chat-header">
        <span>AMP ROOM CHAT</span>
        <button class="toggle" style="padding:2px 6px;font-size:11px;" onclick="toggleChat()">✕</button>
      </div>
      <div class="chat-messages" id="chatMessages">
        <div class="chat-msg" style="color:#adadb8;">Click <strong>Join Wall</strong> above to chat live with the DJs and crowd!</div>
      </div>
      <form class="chat-form" onsubmit="sendChat(event)">
        <input type="text" id="chatInput" placeholder="Say something..." maxlength="200" />
        <button type="submit">Send</button>
      </form>
    </div>
  </div>
  <script>
    var params = new URLSearchParams(window.location.search);
    var isHost = params.get("host") === "true";
    var isDJ = params.get("dj") === "true";
    var obsMode = params.get("obs");
    var role = isHost ? "host" : (isDJ ? "dj" : "fan");

    if (obsMode) {
      document.body.classList.add("obs-mode");
      if (obsMode === "dj") document.body.classList.add("obs-dj-only");
    }

    if (!obsMode) {
      var p1 = "https://player.", p2 = "twitch.tv/", p3 = "?channel=djtripinva", p4 = "&parent=dgrayinva.github.io", p5 = "&muted=false";
      var tf = document.createElement("iframe");
      tf.src = p1 + p2 + p3 + p4 + p5;
      tf.allowFullscreen = true;
      document.getElementById("twitchBox").appendChild(tf);
    }

    var unreadCount = 0;
    function toggleChat() {
      var pane = document.getElementById("chatPane");
      var split = document.getElementById("splitContainer");
      pane.classList.toggle("closed");
      if (pane.classList.contains("closed")) {
        split.classList.remove("chat-open");
      } else {
        split.classList.add("chat-open");
        unreadCount = 0;
        document.getElementById("chatToggleBtn").textContent = "💬 Chat";
        var box = document.getElementById("chatMessages");
        box.scrollTop = box.scrollHeight;
      }
    }

    function appendChat(sender, text, senderRole) {
      var box = document.getElementById("chatMessages");
      var item = document.createElement("div");
      item.className = "chat-msg" + (senderRole === "dj" || senderRole === "host" ? " dj-msg" : "");
      var nameEl = document.createElement("strong");
      nameEl.textContent = sender + ":";
      var textEl = document.createElement("span");
      textEl.textContent = text;
      item.appendChild(nameEl);
      item.appendChild(textEl);
      box.appendChild(item);
      box.scrollTop = box.scrollHeight;

      if (document.getElementById("chatPane").classList.contains("closed")) {
        unreadCount = unreadCount + 1;
        document.getElementById("chatToggleBtn").textContent = "💬 Chat (" + unreadCount + ")";
      }
    }

    function sendChat(e) {
      e.preventDefault();
      var input = document.getElementById("chatInput");
      var text = input.value.trim();
      if (!text) return;
      if (!room || room.state !== "connected") {
        alert("Click 'Join Wall' first so you can chat with the room!");
        return;
      }
      var name = document.getElementById("username").value.trim() || (isDJ ? "Guest DJ" : "Fan");
      appendChat(name + " (You)", text, role);
      var payload = JSON.stringify({ type: "chat", sender: name, text: text, role: role });
      room.localParticipant.publishData(new TextEncoder().encode(payload), { reliable: true });
      input.value = "";
    }

    var spotlightedTile = null;
    function resetSpotlight() {
      if (!spotlightedTile) return;
      var split = document.getElementById("splitContainer"), grid = document.getElementById("videoGrid"), tb = document.getElementById("twitchBox");
      spotlightedTile.classList.remove("main-stage");
      spotlightedTile.classList.add("video-tile");
      grid.appendChild(spotlightedTile);
      tb.className = "main-stage";
      split.insertBefore(tb, grid);
      spotlightedTile = null;
      document.getElementById("spotlightBtn").textContent = "Spotlight";
    }

    function spotlightRandom() {
      if (spotlightedTile) return resetSpotlight();
      var split = document.getElementById("splitContainer"), grid = document.getElementById("videoGrid"), tb = document.getElementById("twitchBox");
      var tiles = Array.from(grid.querySelectorAll(".video-tile")).filter(function(t) { return t.id !== "placeholderTile"; });
      if (!tiles.length) return alert("No cameras active on the wall yet!");
      var pick = tiles[Math.floor(Math.random() * tiles.length)];
      spotlightedTile = pick;
      pick.classList.remove("video-tile");
      pick.classList.add("main-stage");
      split.insertBefore(pick, grid);
      tb.className = "video-tile";
      grid.prepend(tb);
      document.getElementById("spotlightBtn").textContent = "Reset View";
    }

    function toggleCrowd() {
      document.body.classList.toggle("hide-crowd");
      var hidden = document.body.classList.contains("hide-crowd");
      document.getElementById("crowdBtn").textContent = hidden ? "Show Crowd" : "Hide Crowd";
    }

    function triggerBurst(char) {
      var items = char === "🎉" ? ["🎉", "🎊", "✨", "🪩"] : ["🎆", "🎇", "✨", "💥"];
      var i = 0;
      while (i !== 28) {
        (function(delay) {
          setTimeout(function() {
            var pick = items[Math.floor(Math.random() * items.length)];
            spawnEmoji(pick, 5 + Math.random() * 90);
          }, delay);
        })(i * 45);
        i = i + 1;
      }
    }

    function spawnEmoji(char, leftVw) {
      var el = document.createElement("div");
      el.className = "float-emoji";
      el.textContent = char;
      el.style.left = (typeof leftVw === "number" ? leftVw : (15 + Math.random() * 70)) + "vw";
      el.style.fontSize = (24 + Math.floor(Math.random() * 20)) + "px";
      document.body.appendChild(el);
      setTimeout(function() { el.remove(); }, 3000);
    }

    function sendEmoji(char, isBurst) {
      if (isBurst) triggerBurst(char);
      else spawnEmoji(char);
      if (room && room.state === "connected") {
        var payload = JSON.stringify({ type: "emoji", char: char, burst: !!isBurst });
        room.localParticipant.publishData(new TextEncoder().encode(payload), { reliable: false });
      }
    }
    var LIVEKIT_URL = "wss://" + "amp-py17bq2u" + ".livekit.cloud";
    var TOKEN_ENDPOINT = "https://" + "late-voice-bceb.devingslk" + ".workers.dev";
    var room;

    function updateCount() {
      var count = document.querySelectorAll("#videoGrid .video-tile:not(#placeholderTile)").length + (spotlightedTile ? 1 : 0);
      document.getElementById("spotCount").textContent = "• Video Wall (" + count + "/20)";
    }

    function loadSDK() {
      return new Promise(function(res, rej) {
        if (window.LivekitClient) return res();
        var s = document.createElement("script");
        var u1 = "https://cdn.", u2 = "jsdelivr.net", u3 = "/npm/livekit-client@2", u4 = "/dist/livekit-client.umd.min.js";
        s.src = u1 + u2 + u3 + u4;
        s.onload = res;
        s.onerror = function() { rej(new Error("Could not download LiveKit video library")); };
        document.head.appendChild(s);
      });
    }

    async function joinWall(viewOnly) {
      var name = document.getElementById("username").value.trim() || (isDJ ? "Guest DJ" : "Fan");
      var ph = document.getElementById("placeholderTile");
      if (ph) ph.remove();

      document.getElementById("joinBtn").disabled = true;
      try {
        await loadSDK();
        var res = await fetch(TOKEN_ENDPOINT + "?room=amp-show&role=" + role + "&username=" + encodeURIComponent(name));
        var rawText = await res.text();
        var data;
        try { data = JSON.parse(rawText); } catch(e) { throw new Error("Worker returned non-JSON: " + rawText.slice(0, 80)); }

        if (data.error === "BANNED") {
          alert("You have been blocked from joining the video wall for this show.");
          document.getElementById("joinBtn").disabled = false;
          return;
        }
        if (data.error === "FULL") {
          alert("The dancefloor is full (20/20 cameras active)! Please try joining again once someone logs out.");
          document.getElementById("joinBtn").disabled = false;
          return;
        }
        if (!data.token) throw new Error("Worker did not return a token: " + rawText.slice(0, 80));

        room = new LivekitClient.Room({ adaptiveStream: true, dynacast: true });
        room.on(LivekitClient.RoomEvent.TrackSubscribed, function(track, pub, p) {
          if (track.kind === LivekitClient.Track.Kind.Video) attachTrack(track, p.identity, p.metadata, false);
        });
        room.on(LivekitClient.RoomEvent.ParticipantDisconnected, function(p) {
          var sid = "tile-" + p.identity.replace(/[^a-zA-Z0-9]/g, "_");
          if (spotlightedTile && spotlightedTile.id === sid) resetSpotlight();
          var el = document.getElementById(sid);
          if (el) el.remove();
          updateCount();
        });
        room.on(LivekitClient.RoomEvent.Disconnected, function() { leaveWall(); });
        room.on(LivekitClient.RoomEvent.DataReceived, function(payload) {
          try {
            var msg = JSON.parse(new TextDecoder().decode(payload));
            if (msg.type === "emoji") {
              if (msg.burst) triggerBurst(msg.char);
              else spawnEmoji(msg.char);
            } else if (msg.type === "chat") {
              appendChat(msg.sender, msg.text, msg.role);
            }
          } catch(e) {}
        });

        await room.connect(LIVEKIT_URL, data.token);

        if (!viewOnly) {
          var camOpts = isDJ ? { resolution: { width: 1280, height: 720, frameRate: 30 } } : { resolution: { width: 320, height: 180, frameRate: 15 } };
          await room.localParticipant.setCameraEnabled(true, camOpts);
          await room.localParticipant.setMicrophoneEnabled(false);

          var pubs = Array.from(room.localParticipant.videoTrackPublications.values());
          var firstPub = pubs.shift();
          if (firstPub && firstPub.track) {
            attachTrack(firstPub.track, name + " (You)", JSON.stringify({ role: role }), true);
          }
        }

        document.getElementById("joinBtn").style.display = "none";
        document.getElementById("leaveBtn").style.display = "inline-block";
      } catch (err) {
        alert("Error: " + (err && err.message ? err.message : String(err)));
        document.getElementById("joinBtn").disabled = false;
      }
    }

    function attachTrack(track, id, metaStr, isMe) {
      var sid = "tile-" + id.replace(/[^a-zA-Z0-9]/g, "_");
      if (document.getElementById(sid)) return;
      var meta = {};
      try { meta = JSON.parse(metaStr || "{}"); } catch(e) {}
      var tile = document.createElement("div");
      tile.className = "video-tile" + (meta.role === "dj" ? " dj-tile" : "") + (isMe ? " is-me" : "");
      tile.id = sid;
      var v = track.attach();
      v.muted = true;
      var tag = document.createElement("div");
      tag.className = "name-tag";
      tag.textContent = id;
      tile.appendChild(v);
      tile.appendChild(tag);

      if (isHost && !isMe) {
        var kb = document.createElement("button");
        kb.className = "kick-btn";
        kb.textContent = "✕ Kick & Block";
        kb.onclick = function() {
          if (confirm("Kick and block " + id + " from rejoining?")) {
            fetch(TOKEN_ENDPOINT + "?action=kick&room=amp-show&target=" + encodeURIComponent(id));
          }
        };
        tile.appendChild(kb);
      }

      document.getElementById("videoGrid").appendChild(tile);
      updateCount();
    }

    async function leaveWall() {
      resetSpotlight();
      if (room) {
        var r = room;
        room = null;
        await r.disconnect();
      }
      document.getElementById("videoGrid").innerHTML = "";
      document.getElementById("leaveBtn").style.display = "none";
      document.getElementById("joinBtn").style.display = "inline-block";
      document.getElementById("joinBtn").disabled = false;
      updateCount();
    }

    if (obsMode) {
      document.getElementById("chatPane").classList.add("closed");
      joinWall(true);
    } else if (window.matchMedia("(max-width: 768px)").matches) {
      document.getElementById("chatPane").classList.add("closed");
    }
  </script>
</body>
</html>
