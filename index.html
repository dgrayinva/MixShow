<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DJ Tripin VA — Live Stream & Fan Wall</title>
  <script src="https://jsdelivr.net"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0e0e10; color: #efeff1; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    header { background: #18181b; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2f2f35; }
    .controls { display: flex; gap: 10px; align-items: center; }
    input { background: #0e0e10; border: 1px solid #3a3a3d; color: white; padding: 6px 10px; border-radius: 4px; }
    button { background: #9147ff; color: white; border: none; padding: 7px 14px; border-radius: 4px; font-weight: 600; cursor: pointer; }
    button:hover { background: #772ce8; }
    button.leave { background: #eb0400; display: none; }
    .split-container { display: flex; flex: 1; height: calc(100vh - 55px); }
    .twitch-pane { flex: 1.2; background: #000; border-right: 1px solid #2f2f35; display: flex; align-items: center; justify-content: center; }
    .twitch-pane iframe { width: 100%; height: 100%; border: none; }
    .grid-pane { flex: 1; padding: 15px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); grid-auto-rows: 140px; gap: 12px; align-content: start; }
    .video-tile { position: relative; background: #1f1f23; border-radius: 8px; overflow: hidden; border: 1px solid #3a3a3d; display: flex; align-items: center; justify-content: center; color: #adadb8; font-size: 13px; }
    .video-tile video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    .name-tag { position: absolute; bottom: 8px; left: 8px; background: rgba(0, 0, 0, 0.75); color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
    @media (max-width: 768px) { .split-container { flex-direction: column; } .twitch-pane { flex: none; height: 40vh; } }
  </style>
</head>
<body>
  <header>
    <div><strong>DJ TRIPIN VA</strong> <span style="font-size: 12px; color: #adadb8;">• Fan Wall (Video Only)</span></div>
    <div class="controls">
      <input type="text" id="username" placeholder="Your Name" />
      <button id="joinBtn" onclick="joinWall()">Join Video Wall</button>
      <button id="leaveBtn" class="leave" onclick="leaveWall()">Leave Wall</button>
    </div>
  </header>
  <div class="split-container">
    <div class="twitch-pane" id="twitchContainer">
      <iframe src="https://twitch.tv" allowfullscreen></iframe>
    </div>
    <div class="grid-pane" id="videoGrid">
      <div class="video-tile" id="placeholderTile">
        <span style="padding: 12px; text-align: center;">Click <strong>Join Video Wall</strong> to turn on your camera (Audio is disabled)</span>
      </div>
    </div>
  </div>
