<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AMP — Live Stream & Fan Wall</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0e0e10; color: #efeff1; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    header { background: #18181b; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2f2f35; gap: 8px; flex-wrap: wrap; }
    .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    input { background: #0e0e10; border: 1px solid #3a3a3d; color: white; padding: 6px 10px; border-radius: 4px; width: 130px; }
    button { background: #9147ff; color: white; border: none; padding: 7px 12px; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 13px; }
    button:hover { background: #772ce8; }
    button.spotlight { background: #00a8fc; }
    button.spotlight:hover { background: #0086c9; }
    button.leave { background: #eb0400; display: none; }
    .split-container { display: flex; flex: 1; overflow: hidden; }
    .main-stage { flex: 1.2; background: #000; border-right: 1px solid #2f2f35; position: relative; border-radius: 0; border-top: none; border-bottom: none; border-left: none; }
    .main-stage iframe, .main-stage video { width: 100%; height: 100%; border: none; display: block; object-fit: cover; }
    .grid-pane { flex: 1; padding: 12px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); grid-auto-rows: 135px; gap: 10px; align-content: start; }
    .video-tile { position: relative; background: #1f1f23; border-radius: 8px; overflow: hidden; border: 1px solid #3a3a3d; display: flex; align-items: center; justify-content: center; color: #adadb8; font-size: 13px; height: 135px; }
    .video-tile video, .video-tile iframe { width: 100%; height: 100%; object-fit: cover; border: none; }
    video { transform: scaleX(-1); }
    .name-tag { position: absolute; bottom: 8px; left: 8px; background: rgba(0, 0, 0, 0.75); color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 12px; z-index: 2; }
    @media (max-width: 768px) {
      .split-container { flex-direction: column; }
      .main-stage { flex: none; height: 38dvh; border-right: none; border-bottom: 1px solid #2f2f35; }
      input { width: 105px; }
    }
  </style>
</head>
<body>
  <header>
    <div><strong>AMP</strong> <span style="font-size: 12px; color: #adadb8;">• Fan Wall (Video Only)</span></div>
    <div class="controls">
      <input type="text" id="username" placeholder="Your Name" />
      <button id="spotlightBtn" class="spotlight" onclick="spotlightRandom()">Spotlight Fan</button>
      <button id="joinBtn" onclick="joinWall()">Join Wall</button>
      <button id="leaveBtn" class="leave" onclick="leaveWall()">Leave</button>
    </div>
  </header>
  <div class="split-container" id="splitContainer">
    <div class="main-stage" id="twitchBox">
      <div class="name-tag">AMP (Live)</div>
    </div>
    <div class="grid-pane" id="videoGrid">
      <div class="video-tile" id="placeholderTile">
        <span style="padding: 12px; text-align: center;">Click <strong>Join Wall</strong> to turn on your camera (Muted)</span>
      </div>
    </div>
  </div>
  <script>
    // 1. Build Twitch URL safely so extensions cannot strip parameters
    var p1 = "https://player.";
    var p2 = "twitch.tv/";
    var p3 = "?channel=djtripinva";
    var p4 = "&parent=dgrayinva.github.io";
    var p5 = "&muted=false";

    var twitchFrame = document.createElement("iframe");
    twitchFrame.src = p1 + p2 + p3 + p4 + p5;
    twitchFrame.allowFullscreen = true;
    document.getElementById("twitchBox").appendChild(twitchFrame);

    // 2. Spotlight Random Fan Swap (keeps Twitch audio running)
    var spotlightedTile = null;

    function resetSpotlight() {
      if (!spotlightedTile) return;
      var split = document.getElementById("splitContainer");
      var grid = document.getElementById("videoGrid");
      var twitchBox = document.getElementById("twitchBox");

      spotlightedTile.className = "video-tile";
      grid.appendChild(spotlightedTile);

      twitchBox.className = "main-stage";
      split.insertBefore(twitchBox, grid);

      spotlightedTile = null;
      document.getElementById("spotlightBtn").textContent = "Spotlight Fan";
    }

    function spotlightRandom() {
      if (spotlightedTile) {
        resetSpotlight();
        return;
      }
      var split = document.getElementById("splitContainer");
      var grid = document.getElementById("videoGrid");
      var twitchBox = document.getElementById("twitchBox");

      var tiles = Array.from(grid.querySelectorAll(".video-tile")).filter(function(t) {
        return t.id !== "placeholderTile";
      });
      if (tiles.length === 0) {
        alert("No fan cameras are active on the wall yet!");
        return;
      }

      var randomTile = tiles[Math.floor(Math.random() * tiles.length)];
      spotlightedTile = randomTile;

      // Move chosen fan onto the main stage & move Twitch into a grid tile
      randomTile.className = "main-stage";
      split.insertBefore(randomTile, grid);

      twitchBox.className = "video-tile";
      grid.prepend(twitchBox);

      document.getElementById("spotlightBtn").textContent = "Reset View";
    }

    // 3. Lazy-load LiveKit SDK only when needed so page loads fast
    function loadLiveKitSDK() {
      return new Promise(function(resolve, reject) {
        if (window.LivekitClient) return resolve();
        var s = document.createElement("script");
        s.src = "https://jsdelivr.net";
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
    }

    var LIVEKIT_URL = "wss://your-project.livekit.cloud";
    var TOKEN_ENDPOINT = "https://workers.dev";
    var room;

    async function joinWall() {
      var name = document.getElementById("username").value.trim() || "Fan";
      var placeholder = document.getElementById("placeholderTile");
      if (placeholder) placeholder.remove();

      if (LIVEKIT_URL.indexOf("your-project") !== -1) {
        try {
          var stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          attachLocalPreview(stream, name + " (Preview)");
          document.getElementById("joinBtn").style.display = "none";
          document.getElementById("leaveBtn").style.display = "inline-block";
        } catch (err) {
          alert("Please allow camera access in your browser.");
        }
        return;
      }

      document.getElementById("joinBtn").disabled = true;
      try {
        await loadLiveKitSDK();
        var res = await fetch(TOKEN_ENDPOINT + "?room=djtripinva&username=" + encodeURIComponent(name));
        var data = await res.json();

        room = new LivekitClient.Room({ adaptiveStream: true, dynacast: true });
        room.on(LivekitClient.RoomEvent.TrackSubscribed, function(track, pub, participant) {
          if (track.kind === LivekitClient.Track.Kind.Video) attachTrack(track, participant.identity);
        });
        room.on(LivekitClient.RoomEvent.ParticipantDisconnected, function(participant) {
          var safeId = "tile-" + participant.identity.replace(/[^a-zA-Z0-9]/g, "_");
          if (spotlightedTile && spotlightedTile.id === safeId) resetSpotlight();
          var el = document.getElementById(safeId);
          if (el) el.remove();
        });

        await room.connect(LIVEKIT_URL, data.token);
        await room.localParticipant.setCameraEnabled(true);
        await room.localParticipant.setMicrophoneEnabled(false);

        var pubs = Array.from(room.localParticipant.videoTrackPublications.values());
        if (pubs.length && pubs.track) attachTrack(pubs.track, name + " (You)");

        document.getElementById("joinBtn").style.display = "none";
        document.getElementById("leaveBtn").style.display = "inline-block";
      } catch (err) {
        alert("Could not connect to LiveKit room.");
        document.getElementById("joinBtn").disabled = false;
      }
    }

    function attachLocalPreview(stream, label) {
      var tile = document.createElement("div");
      tile.className = "video-tile";
      var video = document.createElement("video");
      video.srcObject = stream; video.autoplay = true; video.playsInline = true; video.muted = true;
      var tag = document.createElement("div");
      tag.className = "name-tag"; tag.textContent = label;
      tile.appendChild(video); tile.appendChild(tag);
      document.getElementById("videoGrid").appendChild(tile);
    }

    function attachTrack(track, id) {
      var safeId = "tile-" + id.replace(/[^a-zA-Z0-9]/g, "_");
      if (document.getElementById(safeId)) return;
      var tile = document.createElement("div");
      tile.className = "video-tile"; tile.id = safeId;
      var videoEl = track.attach(); videoEl.muted = true;
      var tag = document.createElement("div");
      tag.className = "name-tag"; tag.textContent = id;
      tile.appendChild(videoEl); tile.appendChild(tag);
      document.getElementById("videoGrid").appendChild(tile);
    }

    async function leaveWall() {
      resetSpotlight();
      if (room) await room.disconnect();
      document.getElementById("videoGrid").innerHTML = "";
      document.getElementById("leaveBtn").style.display = "none";
      document.getElementById("joinBtn").style.display = "inline-block";
      document.getElementById("joinBtn").disabled = false;
    }
  </script>
</body>
</html>
